# Lockup detection + post-mortem capture for the idle hard-hang hunt (dots-d532).
#
# Install as /etc/sysctl.d/90-lockup-diag.conf.
#
# Why 90-: sysctl.d sorts every file in /etc, /run, /usr/local/lib and /usr/lib
# together by BASENAME, lexicographically-latest wins. This must sort after
# /usr/lib/sysctl.d/70-cachyos-settings.conf, which sets nmi_watchdog = 0 and
# printk = 3 3 3 3. sysctl.d(5) recommends 60-90 for files in /etc.
#
# "nowatchdog" and "quiet" are already off the kernel cmdline; that alone was
# NOT enough -- the CachyOS file above still pins nmi_watchdog to 0 and printk
# to 3 3 3 3 on every boot. This file is what actually countermands it.

# Re-enable the NMI hard-lockup detector that 70-cachyos-settings.conf disables
# for performance/power. This is the mechanism that notices a wedged CPU.
kernel.nmi_watchdog = 1
kernel.watchdog = 1

# Make a detected lockup panic rather than merely warn --
# CONFIG_BOOTPARAM_HARDLOCKUP_PANIC is not set in this kernel, so warn-only is
# the default and a hard lock would otherwise leave nothing behind.
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.panic_on_oops = 1

# Auto-reboot 20s after a panic so the machine comes back unattended.
kernel.panic = 20

# 70-cachyos-settings.conf sets "3 3 3 3" to hide kernel messages from the
# console, which hides a panic too. Restore console visibility while
# diagnosing. Revert this once the hang is understood if the noise annoys.
kernel.printk = 7 4 1 7
